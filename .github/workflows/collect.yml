name: МедПраво — сбор и публикация
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Только переопубликовать сохранённую ленту (без сбора)'
        type: boolean
        default: false
      make_digest:
        description: 'Сформировать ИИ-сводку (до 18:00 — предварительную)'
        type: boolean
        default: false
      retry_failed:
        description: 'Повторить только недоступные источники'
        type: boolean
        default: false

concurrency:
  group: medpravo-collection
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Подготовить чтение PDF
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt
      - name: Подготовить распознавание сканов
        if: ${{ inputs.publish_only != true && github.event.schedule != '0 15 * * *' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - name: Проверка программы
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/test_github_client.js
          python -m py_compile github_relay.py russian_proxy.py
          bash -n deploy/install_relay.sh
      - name: Восстановить историю
        run: python github_state.py restore
      - name: Подключить российское соединение, если настроено
        id: relay
        if: ${{ vars.MEDPRAVO_RELAY_HOST != '' && inputs.publish_only != true && github.event.schedule != '0 15 * * *' }}
        env:
          RELAY_HOST: ${{ vars.MEDPRAVO_RELAY_HOST }}
          RELAY_PRIVATE_KEY: ${{ secrets.MEDPRAVO_RELAY_KEY }}
          RELAY_KNOWN_HOSTS: ${{ secrets.MEDPRAVO_RELAY_KNOWN_HOSTS }}
        run: python github_relay.py start
      - name: Проверить источники и подготовить ленту
        env:
          FETCH_TIMEOUT: '12'
          MEDPRAVO_OCR_ENABLED: '1'
          MEDPRAVO_WORKERS: '3'
          EXPORT_ONLY: ${{ inputs.publish_only == true || github.event.schedule == '0 15 * * *' }}
          RETRY_FAILED: ${{ inputs.retry_failed == true }}
          MEDPRAVO_HTTPS_PROXY: ${{ steps.relay.outputs.proxy_url }}
          MEDPRAVO_NETWORK_ORIGIN: ${{ steps.relay.outputs.proxy_url != '' && 'GitHub Actions через российский SSH-релей' || 'GitHub Actions' }}
        run: |
          if [ "$EXPORT_ONLY" = "true" ]; then
            python github_collect.py --export-only
          elif [ "$RETRY_FAILED" = "true" ]; then
            python github_collect.py --retry-failed
          else
            python github_collect.py
          fi
      - name: Восстановить открытую модель Qwen из кэша
        if: ${{ github.event.schedule == '0 15 * * *' || inputs.make_digest == true }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .model-cache
          key: qwen3-4b-359d7dd4bcda-v1
      - name: Запустить открытую модель на GitHub
        if: ${{ github.event.schedule == '0 15 * * *' || inputs.make_digest == true }}
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_MODELS: ${{ github.workspace }}/.model-cache
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_NUM_PARALLEL: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/medpravo-ollama"
          curl --fail --location --retry 3 --silent --show-error https://github.com/ollama/ollama/releases/download/v0.40.4/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          printf '%s  %s\n' '15f31e9576d15a481e099b4145dba6e9f8c1f295927d6b8895300ae30ed3740a' "$RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/medpravo-ollama"
          rm "$RUNNER_TEMP/ollama.tar.zst"
          "$RUNNER_TEMP/medpravo-ollama/bin/ollama" serve > "$RUNNER_TEMP/medpravo-ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          "$RUNNER_TEMP/medpravo-ollama/bin/ollama" pull qwen3:4b
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:11434/api/tags') as response:
              models = json.load(response)['models']
          expected = '359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7'
          assert any(m['name'] == 'qwen3:4b' and m['digest'] == expected for m in models), 'Unexpected model version'
          PY
      - name: Подготовить ежедневную ИИ-сводку
        if: ${{ github.event.schedule == '0 15 * * *' || inputs.make_digest == true }}
        run: python daily_digest.py
      - name: Сохранить историю для следующего запуска
        run: python github_state.py save
      - name: Подготовить сайт к публикации
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 1
      - name: Закрыть временное российское соединение
        if: ${{ always() && vars.MEDPRAVO_RELAY_HOST != '' && inputs.publish_only != true && github.event.schedule != '0 15 * * *' }}
        run: python github_relay.py stop
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать ленту
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
