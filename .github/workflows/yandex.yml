name: МедПраво — проверка через Яндекс
on: workflow_dispatch
permissions:
  contents: read
jobs:
  yandex:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Установить браузер из официального подписанного репозитория Яндекса
        run: |
          curl --fail --show-error --silent --max-time 60 https://repo.yandex.ru/yandex-browser/YANDEX-BROWSER-KEY.GPG -o /tmp/yandex-browser-key.gpg
          sudo gpg --dearmor --output /usr/share/keyrings/yandex-browser.gpg /tmp/yandex-browser-key.gpg
          echo 'deb [signed-by=/usr/share/keyrings/yandex-browser.gpg] https://repo.yandex.ru/yandex-browser/deb stable main' | sudo tee /etc/apt/sources.list.d/yandex-browser.list
          sudo apt-get update
          sudo apt-get install -y yandex-browser-stable xvfb
          python -m pip install playwright==1.64.0
      - name: Подключить существующий российский узел
        id: relay
        if: ${{ vars.MEDPRAVO_RELAY_HOST != '' }}
        env:
          RELAY_HOST: ${{ vars.MEDPRAVO_RELAY_HOST }}
          RELAY_PRIVATE_KEY: ${{ secrets.MEDPRAVO_RELAY_KEY }}
          RELAY_KNOWN_HOSTS: ${{ secrets.MEDPRAVO_RELAY_KNOWN_HOSTS }}
        run: python github_relay.py start
      - name: Проверить каталоги через настоящий Яндекс Браузер
        env:
          MEDPRAVO_HTTPS_PROXY: ${{ steps.relay.outputs.proxy_url }}
          PROBE_SOURCE_IDS: rospotreb
        run: xvfb-run -a python yandex_probe.py
      - name: Закрыть временное соединение
        if: ${{ always() && vars.MEDPRAVO_RELAY_HOST != '' }}
        run: python github_relay.py stop
